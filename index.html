<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Seat Finder</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background:#f6efe7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    color:#6b4b3e;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:white;
    border-radius:32px;
    padding:40px 28px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.small-title{
    text-align:center;
    letter-spacing:0px;
    font-size:12px;
    margin-bottom:16px;
}

.couple-name{
    font-family:'Great Vibes', cursive;
    text-align:center;
    font-size:50px;
    line-height:1;
}

.infinity{
    text-align:center;
    font-size:28px;
    margin:0px 0;
}

.date{
    text-align:center;
    margin-top:16px;
    font-size:15px;
    letter-spacing:0px;
}

.venue{
    text-align:center;
    margin-top:4px;
    font-size:15px;
    letter-spacing:0px;
}

.section{
    margin-top:20px;
}

.label{
    margin-bottom:12px;
    font-weight:500;
}

/* =========================================
   COMBOBOX
========================================= */

.combo-container{
    position:relative;
}

.combo-input{
    width:100%;
    padding:16px;
    border-radius:18px;
    border:2px solid #ead7cb;
    background:white;
    font-size:16px;
    outline:none;
}

/* DROPDOWN */

.dropdown{
    position:absolute;
    width:100%;
    background:white;
    border-radius:18px;
    margin-top:8px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
    z-index:999;
    max-height:300px;
    overflow-y:auto;
    display:none;
}

.dropdown-item{
    padding:14px 16px;
    cursor:pointer;
    transition:0.2s;
}

.dropdown-item:hover{
    background:#f7eee8;
}

/* BUTTONS */

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.search-btn{
    margin-top:18px;
    background:linear-gradient(135deg,#b9856b,#8c5a42);
    color:white;
}

.search-btn:hover{
    transform:translateY(-2px);
}

.reset-btn{
    margin-top:12px;
    background:#eee2d8;
    color:#6b4b3e;
}

/* LOADER */

.loader{
    display:none;
    margin-top:28px;
    text-align:center;
}

.loader-circle{
    width:60px;
    height:60px;
    border:5px solid #ead7cb;
    border-top:5px solid #b9856b;
    border-radius:50%;
    margin:auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* RESULT */

.result{
    display:none;
    margin-top:32px;
    text-align:center;
}

.result-title{
    font-size:18px;
}

.seat-number{
    font-size:56px;
    font-weight:600;
    color:#8c5a42;
    margin-top:10px;
}

/* ERROR */

.not-found{
    margin-top:24px;
    text-align:center;
    color:#b00020;
}

/* FOOTER */

.footer{
    margin-top:34px;
    text-align:center;
    letter-spacing:3px;
    font-size:13px;
}

@media(max-width:480px){

    .couple-name{
        font-size:52px;
    }

    .card{
        padding:32px 22px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="small-title">
            WELCOME TO THE WEDDING OF
        </div>

        <div class="couple-name">
            Nutchaya
        </div>

        <div class="infinity">∞</div>

        <div class="couple-name">
            Trinnachoke
        </div>

        <div class="date">
            SATURDAY 22.08.26 
        </div>

        <div class="venue">
            @ KEP Phuket
        </div>

        <!-- SEARCH SECTION -->

        <div class="section">

            <div class="label">
                Select Your Name
            </div>

            <div class="combo-container">

                <input
                    type="text"
                    id="nameInput"
                    class="combo-input"
                    placeholder="Type or select your name..."
                    autocomplete="off"
                >

                <div
                    id="dropdown"
                    class="dropdown"
                ></div>

            </div>

            <button
                class="search-btn"
                onclick="searchSeat()"
            >
                Find My Seat
            </button>

            <button
                class="reset-btn"
                onclick="resetSearch()"
            >
                Reset
            </button>

        </div>

        <!-- LOADER -->

        <div
            class="loader"
            id="loader"
        >

            <div class="loader-circle"></div>

            <p style="margin-top:14px;">
                Searching for your seat...
            </p>

        </div>

        <!-- RESULT -->

        <div
            class="result"
            id="result"
        >

            <div class="result-title">
                Your Seat Number
            </div>

            <div
                class="seat-number"
                id="seatNumber"
            ></div>

        </div>

        <!-- ERROR -->

        <div
            class="not-found"
            id="notFound"
        ></div>

        <div class="footer">
            #NHTOGETHER
        </div>

    </div>

</div>

<script>

/* =========================================
   API URL
========================================= */

const apiUrl =
"https://script.google.com/macros/s/AKfycbxeZOcan_RUazGYWVMDgUq4dSZCEalSlNXXPy0Ngc_qM_fGw_i8d4j5a6u_eVEstcBu/exec";

/* =========================================
   ELEMENTS
========================================= */

const nameInput =
document.getElementById("nameInput");

const dropdown =
document.getElementById("dropdown");

/* =========================================
   LOAD / FILTER NAMES
========================================= */

async function loadNames(keyword = ""){

    try{

        const response = await fetch(
            `${apiUrl}?action=suggest&keyword=${encodeURIComponent(keyword)}`
        );

        const data =
        await response.json();

        dropdown.innerHTML = "";

        if(data.length === 0){

            const div =
            document.createElement("div");

            div.className =
            "dropdown-item";

            div.innerText =
            "No matching names";

            dropdown.appendChild(div);

            dropdown.style.display =
            "block";

            return;
        }

        data.forEach(item => {

            const div =
            document.createElement("div");

            div.className =
            "dropdown-item";

            div.innerText =
            item.name;

            div.onclick = () => {

                nameInput.value =
                item.name;

                dropdown.style.display =
                "none";

            };

            dropdown.appendChild(div);

        });

        dropdown.style.display =
        "block";

    }
    catch(error){

        console.error(error);

    }

}

/* =========================================
   SHOW ALL NAMES WHEN CLICKING INPUT
========================================= */

nameInput.addEventListener("focus", function(){

    loadNames("");

});

/* =========================================
   FILTER NAMES WHILE TYPING
========================================= */

nameInput.addEventListener("input", function(){

    loadNames(this.value);

});

/* =========================================
   CLOSE DROPDOWN WHEN CLICK OUTSIDE
========================================= */

document.addEventListener("click", function(e){

    if(
        !nameInput.contains(e.target) &&
        !dropdown.contains(e.target)
    ){

        dropdown.style.display =
        "none";

    }

});

/* =========================================
   SEARCH SEAT
========================================= */

async function searchSeat(){

    const name =
    nameInput.value.trim();

    if(!name){

        alert("Please select your name");

        return;
    }

    document.getElementById("loader")
    .style.display = "block";

    document.getElementById("result")
    .style.display = "none";

    document.getElementById("notFound")
    .innerText = "";

    try{

        const response = await fetch(
            `${apiUrl}?name=${encodeURIComponent(name)}`
        );

        const data =
        await response.json();

        document.getElementById("loader")
        .style.display = "none";

        if(data.found){

            document.getElementById("result")
            .style.display = "block";

            document.getElementById("seatNumber")
            .innerText =
            data.seat;

        }
        else{

            document.getElementById("notFound")
            .innerText =
            "Guest name not found";

        }

    }
    catch(error){

        document.getElementById("loader")
        .style.display = "none";

        document.getElementById("notFound")
        .innerText =
        "An error occurred while searching";

    }

}

/* =========================================
   RESET
========================================= */

function resetSearch(){

    nameInput.value = "";

    dropdown.innerHTML = "";

    dropdown.style.display =
    "none";

    document.getElementById("result")
    .style.display = "none";

    document.getElementById("notFound")
    .innerText = "";

}

</script>

</body>
</html>
